services:
  - type: web
    name: edutenant-erp
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: "EduTenant ERP"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: false   # you will paste this manually in Render dashboard
      - key: APP_URL
        value: https://edutenant-erp.onrender.com   # update after first deploy

      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: edutenant-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: edutenant-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: edutenant-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: edutenant-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: edutenant-db
          property: password

      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error

      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_FROM_NAME
        value: "EduTenant ERP"
      # Set MAIL_USERNAME, MAIL_PASSWORD, MAIL_FROM_ADDRESS manually in dashboard

      - key: RAZORPAY_KEY_ID
        value: rzp_test_demo
      - key: SMS_ENABLED
        value: "false"
      - key: WHATSAPP_ENABLED
        value: "false"
